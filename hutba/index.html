<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071226">
<title>Hutba – prijevod uživo</title>
<style>
  :root {
    --pozadina: #071226; --kartica: rgba(255, 255, 255, 0.06); --rub: rgba(227, 194, 122, 0.28);
    --zlato: #e3c27a; --tekst: #f3efe6; --blijedo: #9fb0c8; --crveno: #e5484d; --zeleno: #3dd68c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #142a52 0%, var(--pozadina) 65%) fixed;
    background-color: var(--pozadina);
    color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  .skriveno { display: none !important; }

  /* Jezik stranice / Sprache der Seite */
  .jezici { display: inline-flex; border: 1px solid var(--rub); border-radius: 10px; overflow: hidden; flex: none; }
  .jezici button {
    border: 0; background: transparent; color: var(--blijedo); font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    padding: 7px 10px; cursor: pointer;
  }
  .jezici button.aktivan { background: var(--zlato); color: #1a1408; }
  .prijava-vrh { display: flex; justify-content: flex-end; }

  /* Lozinka / Passwort */
  .prijava { margin-top: 14vh; text-align: center; }
  .prijava input {
    width: 100%; max-width: 280px; font-size: 26px; text-align: center; letter-spacing: 0.3em;
    padding: 14px; margin-top: 22px; border-radius: 14px; border: 1px solid var(--rub);
    background: var(--kartica); color: var(--tekst); outline: none;
  }
  .prijava input::placeholder { letter-spacing: normal; font-size: 18px; }
  .prijava input:focus { border-color: var(--zlato); }
  .dugme {
    display: inline-block; margin-top: 16px; padding: 14px 34px; font-size: 18px; font-weight: 600;
    border-radius: 14px; border: 0; background: var(--zlato); color: #1a1408; cursor: pointer; text-decoration: none;
  }
  .greska-lozinke { color: var(--crveno); margin-top: 12px; min-height: 20px; font-size: 15px; }

  /* Glavni ekran / Hauptbildschirm */
  .zaglavlje { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .veza { font-size: 13px; color: var(--blijedo); display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .veza i { width: 9px; height: 9px; border-radius: 50%; background: var(--crveno); display: inline-block; }
  .veza.ok i { background: var(--zeleno); }

  .mikrofon-dio { text-align: center; margin: 30px 0 10px; }
  .mikrofon {
    width: 168px; height: 168px; border-radius: 50%; border: 2px solid var(--zlato);
    background: radial-gradient(circle at 50% 35%, rgba(227, 194, 122, 0.22), rgba(227, 194, 122, 0.05));
    color: var(--zlato); cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .mikrofon:active { transform: scale(0.96); }
  .mikrofon svg { width: 70px; height: 70px; }
  .mikrofon.ukljucen { border-color: var(--crveno); color: #fff; background: radial-gradient(circle at 50% 35%, #ff6b6f, var(--crveno)); }
  .mikrofon.ukljucen::before, .mikrofon.ukljucen::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--crveno);
    animation: val 2s ease-out infinite;
  }
  .mikrofon.ukljucen::after { animation-delay: 1s; }
  @keyframes val { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.55); opacity: 0; } }
  .status { margin-top: 18px; font-size: 18px; font-weight: 600; min-height: 26px; }
  .status.snima { color: var(--crveno); }
  .vrijeme { font-variant-numeric: tabular-nums; color: var(--blijedo); font-size: 15px; margin-top: 2px; min-height: 20px; }

  .tv-dugme, .kraj-dugme {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 22px;
    padding: 15px 16px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center;
    border: 1.5px solid var(--zlato); background: rgba(227, 194, 122, 0.1); color: var(--zlato);
  }
  .tv-dugme svg, .kraj-dugme svg { width: 24px; height: 24px; flex: none; }
  .tv-dugme.ukljucen { border-color: var(--zeleno); background: rgba(61, 214, 140, 0.14); color: var(--zeleno); cursor: default; }
  .kraj-dugme { margin-top: 12px; border-color: var(--crveno); background: var(--crveno); color: #fff; }
  .kraj-dugme small, .tv-dugme small { display: block; font-weight: 400; font-size: 13px; opacity: 0.9; }

  .upozorenje { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(229, 72, 77, 0.14); border: 1px solid rgba(229, 72, 77, 0.45); font-size: 14.5px; line-height: 1.45; }
  .upozorenje.info { background: rgba(227, 194, 122, 0.1); border-color: var(--rub); }
  .upozorenje ol { margin: 8px 0 0; padding-left: 20px; }
  .upozorenje .kod { margin-top: 6px; opacity: 0.6; font-size: 12px; }
  .upozorenje .dugme { margin-top: 10px; padding: 11px 20px; font-size: 16px; }

  .uputa {
    margin-top: 22px; padding: 14px 16px; border-radius: 14px; background: var(--kartica); border: 1px solid var(--rub);
    font-size: 15px; line-height: 1.5;
  }
  .uputa ol { margin: 6px 0 0; padding-left: 20px; }
  .uputa li { margin: 5px 0; }
  .uputa p { margin: 8px 0 0; color: var(--blijedo); font-size: 14px; }

  .tok { margin-top: 22px; }
  .tok h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blijedo); font-weight: 600; margin: 0 0 8px; }
  .recenica { padding: 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .recenica .bs { color: var(--blijedo); font-size: 14px; font-style: italic; }
  .recenica .njem { font-size: 17px; margin-top: 3px; line-height: 1.4; }
  .recenica .njem.ceka { color: var(--blijedo); }
  .ar { font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif; font-size: 1.25em; color: var(--zlato); }
  .prazno { color: var(--blijedo); font-size: 14px; }

  details { margin-top: 26px; border-radius: 14px; background: var(--kartica); border: 1px solid rgba(255, 255, 255, 0.08); }
  summary { padding: 14px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
  .postavke { padding: 0 16px 16px; font-size: 14px; line-height: 1.45; }
  .postavke label { display: block; margin-top: 14px; font-weight: 600; }
  .postavke input, .postavke select {
    width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(0, 0, 0, 0.25); color: var(--tekst);
  }
  .postavke .mali { color: var(--blijedo); font-size: 13px; margin-top: 4px; }
  .postavke .dugme { margin-top: 10px; padding: 10px 18px; font-size: 15px; }
  .postavke .dugme.sporedno { background: transparent; color: var(--zlato); border: 1px solid var(--rub); }
</style>
</head>
<body>
<main>

  <!-- 1) Lozinka / Passwort -->
  <section id="prijava">
    <div class="prijava-vrh"><div class="jezici"></div></div>
    <div class="prijava">
      <h1 data-t="naslov"></h1>
      <form id="forma-lozinke" autocomplete="off">
        <input id="lozinka" type="password" inputmode="numeric">
        <br><button class="dugme" type="submit" data-t="udji"></button>
      </form>
      <div class="greska-lozinke" id="greska-lozinke"></div>
    </div>
  </section>

  <!-- 2) Glavno / Hauptseite -->
  <section class="skriveno" id="glavno">
    <div class="zaglavlje">
      <div>
        <h1 data-t="naslov"></h1>
        <div class="veza" id="veza"><i></i><span></span></div>
      </div>
      <div class="jezici"></div>
    </div>

    <div class="mikrofon-dio">
      <button class="mikrofon" id="mikrofon" aria-label="Mikrofon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3.5"></path><path d="M8.5 21.5h7"></path>
        </svg>
      </button>
      <div class="status" id="status"></div>
      <div class="vrijeme" id="vrijeme"></div>
    </div>

    <button class="tv-dugme" id="tv-dugme" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
      <span id="tv-tekst"></span>
    </button>
    <button class="kraj-dugme skriveno" id="kraj-dugme" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      <span id="kraj-tekst"></span>
    </button>

    <div class="upozorenje skriveno" id="upozorenje"></div>

    <div class="uputa">
      <b data-t="uputaNaslov"></b>
      <ol><li data-t="u1"></li><li data-t="u2"></li><li data-t="u3"></li></ol>
      <p data-t="u4"></p>
      <p data-t="u5"></p>
    </div>

    <div class="tok">
      <h2 data-t="tokNaslov"></h2>
      <div id="tok"></div>
    </div>

    <details id="detalji">
      <summary data-t="postavke"></summary>
      <div class="postavke">
        <label for="jezik" data-t="jezikGovora"></label>
        <select id="jezik">
          <option value="bs-BA">Bosanski</option>
          <option value="hr-HR">Hrvatski</option>
          <option value="sr-RS">Srpski</option>
          <option value="de-DE">Deutsch</option>
          <option value="en-GB">English</option>
          <option value="tr-TR">Türkçe</option>
          <option value="ar-SA">العربية</option>
        </select>

        <label for="cilj" data-t="prijevodNa"></label>
        <select id="cilj">
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="nl">Nederlands</option>
          <option value="en">English</option>
          <option value="tr">Türkçe</option>
          <option value="ar">العربية</option>
          <option value="bs">Bosanski</option>
        </select>

        <label for="prevodilac" data-t="prevodilac"></label>
        <select id="prevodilac">
          <option value="google" data-t="optGoogle"></option>
          <option value="claude" data-t="optClaude"></option>
        </select>
        <div class="mali" id="prevodilac-info"></div>

        <div id="claude-dio" class="skriveno">
          <label for="kljuc" data-t="kljuc"></label>
          <input id="kljuc" type="password" placeholder="sk-ant-…" autocomplete="off">
          <div class="mali" data-t="kljucInfo"></div>
          <button class="dugme sporedno" id="spremi-kljuc" type="button" data-t="spremi"></button>
          <span class="mali" id="kljuc-stanje"></span>
        </div>

        <button class="dugme sporedno" id="odjava" type="button" style="margin-top:22px" data-t="odjava"></button>
        <div class="mali" data-t="odjavaInfo"></div>
      </div>
    </details>
  </section>
</main>

    var prije = recenice.filter(function (x) { return x.id < r.id && x.gotovo && x.de; }).slice(-5);
    if (!prije.length) return "";
    return "Earlier in this sermon (context only, do not translate again):\n" +
      prije.map(function (x) { return "Original: " + x.bs + "\nTranslation: " + x.de; }).join("\n") + "\n\n";
  }

  function prevedi(r) {
    r.de = ""; r.gotovo = false;
    prikaziTok(); posaljiRecenicu(r);
    var c = claude(), iz = izvor(), ck = ciljKod();
    var posao = c ? prevediClaude(c, r, iz, ck) : prevediGoogle(r.bs, iz.g, ck);
    posao.catch(function () { return c ? prevediGoogle(r.bs, iz.g, ck) : ""; }).then(function (de) {
      de = (de || "").trim();
      if (de === "-" || de === "–") { ukloni(r); return; }
      r.de = de || t("neuspjelo");
      r.gotovo = true;
      prikaziTok(); posaljiRecenicu(r);
    });
  }

  function prevediClaude(c, r, iz, ck) {
    return c.beta.messages.create({
      model: MODEL,
      max_tokens: 2000,
      output_config: { effort: "low" },
      betas: ["server-side-fallback-2026-07-01"],
      fallbacks: "default",
      system: uputa(iz, ck),
      messages: [{ role: "user", content: kontekst(r) + "New segment (" + iz.ime + "):\n" + r.bs }]
    }).then(function (odg) {
      if (odg.stop_reason === "refusal") throw new Error("refusal");
      return odg.content.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("").trim();
    }).catch(function (e) {
      if (e && (e.status === 401 || e.status === 403)) upozori(function () { return t("kljucNe"); });
      throw e;
    });
  }

  function prevediGoogle(tekst, sl, tl) {
    if (sl === tl) return Promise.resolve(tekst);
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + tl + "&dt=t&q=" + encodeURIComponent(tekst);
    return fetch(url).then(function (o) { return o.json(); }).then(function (d) {
      return (d[0] || []).map(function (x) { return x[0]; }).join("");
    });
  }

  function ukloni(r) {
    recenice = recenice.filter(function (x) { return x !== r; });
    r.de = "-"; r.gotovo = true; posaljiRecenicu(r);
    prikaziTok();
  }

  /* =================== Prikaz na mobitelu / Anzeige am Handy =================== */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // Arapski tekst desno-nalijevo / Arabischer Text von rechts nach links
  function sArapskim(s) {
    return esc(s).replace(/[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿][؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿\s]*/g,
      function (a) { return '<bdi class="ar" dir="rtl">' + a.trim() + '</bdi> '; });
  }
  function prikaziTok() {
    var zadnje = recenice.filter(function (r) { return r.bs; }).slice(-6).reverse();
    $("tok").innerHTML = zadnje.length ? zadnje.map(function (r) {
      return '<div class="recenica"><div class="bs">' + esc(r.bs) + '</div>' +
        '<div class="njem' + (r.gotovo ? "" : " ceka") + '"' + (ciljKod() === "ar" ? ' dir="rtl"' : "") + '>' +
        (r.gotovo ? sArapskim(r.de) : "…") + '</div></div>';
    }).join("") : '<div class="prazno">' + t("prazno") + '</div>';
  }

  /* =================== Start =================== */
  prevediStranicu();
  if (citaj("hutba-prijava") === LOZINKA) otvori();
  else setTimeout(function () { $("lozinka").focus(); }, 300);
})();
</script>
</body>
</html>
