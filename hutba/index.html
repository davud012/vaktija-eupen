<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="../slike/favicon.png">
<link rel="apple-touch-icon" href="../slike/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Hutba – prijevod uživo</title>
<style>
  @font-face { font-family: "Amiri"; src: url("../fonts/Amiri-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+0750-077F, U+0870-08FF, U+FB50-FDFF, U+FE70-FEFF; }
  :root {
    --pozadina: #f3ecdc; --kartica: rgba(255, 255, 255, 0.78); --rub: rgba(138, 115, 80, 0.28);
    --zlato: #8a7350; --tekst: #0d3d1c; --blijedo: #6f7b6c; --crveno: #c8373c; --zeleno: #005502;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  html { background: #f3ecdc; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #fbf7ee 0%, var(--pozadina) 70%) fixed;
    background-color: var(--pozadina);
    color: var(--tekst); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 40px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0; color: var(--zeleno); }
  .logo { display: block; height: 64px; width: auto; margin: 0 auto 10px; animation: logo-uvod 0.9s ease-out both; }
  .zaglavlje .logo { height: 46px; margin: 0; flex: none; }
  .naslov-red { display: flex; align-items: center; gap: 12px; }
  @keyframes logo-uvod { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: none; } }
  .skriveno { display: none !important; }

  /* Jezik stranice / Sprache der Seite */
  .jezici { display: inline-flex; border: 1px solid var(--rub); border-radius: 10px; overflow: hidden; flex: none; }
  .jezici button {
    border: 0; background: transparent; color: var(--blijedo); font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
    padding: 7px 10px; cursor: pointer;
  }
  .jezici button.aktivan { background: var(--zeleno); color: #fff; }
  .prijava-vrh { display: flex; justify-content: flex-end; }

  /* Lozinka / Passwort */
  .prijava { margin-top: 14vh; text-align: center; }
  .prijava input {
    width: 100%; max-width: 280px; font-size: 26px; text-align: center; letter-spacing: 0.3em;
    padding: 14px; margin-top: 22px; border-radius: 14px; border: 1px solid var(--rub);
    background: var(--kartica); color: var(--tekst); outline: none;
  }
  .prijava input::placeholder { letter-spacing: normal; font-size: 18px; }
  .prijava input:focus { border-color: var(--zeleno); }
  .prijava input { box-shadow: 0 4px 14px rgba(60, 50, 20, 0.06); }
  .dugme {
    display: inline-block; margin-top: 16px; padding: 14px 34px; font-size: 18px; font-weight: 600;
    border-radius: 14px; border: 0; background: var(--zeleno); color: #fff; cursor: pointer; text-decoration: none;
    box-shadow: 0 4px 14px rgba(0, 85, 2, 0.18);
  }
  .greska-lozinke { color: var(--crveno); margin-top: 12px; min-height: 20px; font-size: 15px; }

  /* Glavni ekran / Hauptbildschirm */
  .zaglavlje { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .veza { font-size: 13px; color: var(--blijedo); display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .veza i { width: 9px; height: 9px; border-radius: 50%; background: var(--crveno); display: inline-block; }
  .veza.ok i { background: var(--zeleno); }

  .mikrofon-dio { text-align: center; margin: 30px 0 10px; }
  .mikrofon {
    width: 168px; height: 168px; border-radius: 50%; border: 2px solid var(--zeleno);
    background: radial-gradient(circle at 50% 35%, #ffffff, rgba(255, 255, 255, 0.6));
    box-shadow: 0 8px 26px rgba(60, 50, 20, 0.12);
    color: var(--zeleno); cursor: pointer; position: relative; display: inline-flex; align-items: center; justify-content: center;
    transition: transform 0.15s ease, background 0.3s ease, border-color 0.3s ease;
  }
  .mikrofon:active { transform: scale(0.96); }
  .mikrofon svg { width: 70px; height: 70px; }
  .mikrofon.ukljucen { border-color: var(--crveno); color: #fff; background: radial-gradient(circle at 50% 35%, #ff6b6f, var(--crveno)); }
  .mikrofon.ukljucen::before, .mikrofon.ukljucen::after {
    content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--crveno);
    animation: val 2s ease-out infinite;
  }
  .mikrofon.ukljucen::after { animation-delay: 1s; }
  @keyframes val { from { transform: scale(1); opacity: 0.8; } to { transform: scale(1.55); opacity: 0; } }
  .status { margin-top: 18px; font-size: 18px; font-weight: 600; min-height: 26px; }
  .status.snima { color: var(--crveno); }
  .vrijeme { font-variant-numeric: tabular-nums; color: var(--blijedo); font-size: 15px; margin-top: 2px; min-height: 20px; }

  .tv-dugme, .kraj-dugme {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 22px;
    padding: 15px 16px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center;
    border: 1.5px solid var(--zeleno); background: rgba(255, 255, 255, 0.78); color: var(--zeleno);
  }
  .tv-dugme svg, .kraj-dugme svg { width: 24px; height: 24px; flex: none; }
  .tv-dugme.ukljucen { border-color: var(--zeleno); background: rgba(0, 85, 2, 0.1); color: var(--zeleno); cursor: default; }
  .kraj-dugme { margin-top: 12px; border-color: var(--crveno); background: var(--crveno); color: #fff; }
  .kraj-dugme small, .tv-dugme small { display: block; font-weight: 400; font-size: 13px; opacity: 0.9; }

  .upozorenje { margin-top: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(200, 55, 60, 0.08); border: 1px solid rgba(200, 55, 60, 0.4); font-size: 14.5px; line-height: 1.45; }
  .upozorenje.info { background: rgba(255, 255, 255, 0.78); border-color: var(--rub); }
  .upozorenje ol { margin: 8px 0 0; padding-left: 20px; }
  .upozorenje .kod { margin-top: 6px; opacity: 0.6; font-size: 12px; }
  .upozorenje .dugme { margin-top: 10px; padding: 11px 20px; font-size: 16px; }

  .uputa {
    margin-top: 22px; padding: 14px 16px; border-radius: 14px; background: var(--kartica); border: 1px solid var(--rub);
    font-size: 15px; line-height: 1.5;
  }
  .uputa ol { margin: 6px 0 0; padding-left: 20px; }
  .uputa li { margin: 5px 0; }
  .uputa p { margin: 8px 0 0; color: var(--blijedo); font-size: 14px; }

  .tok { margin-top: 22px; }
  .tok h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--blijedo); font-weight: 600; margin: 0 0 8px; }
  .recenica { padding: 10px 0; border-top: 1px solid rgba(13, 61, 28, 0.1); }
  .recenica .bs { color: var(--blijedo); font-size: 14px; font-style: italic; }
  .recenica .njem { font-size: 17px; margin-top: 3px; line-height: 1.4; }
  .recenica .njem.ceka { color: var(--blijedo); }
  .ar { font-family: "Amiri", "Scheherazade New", "Noto Naskh Arabic", "Traditional Arabic", serif; font-size: 1.25em; color: var(--zlato); }
  .ar-blok { display: block; text-align: right; font-family: "Amiri", "Scheherazade New", serif; font-size: 1.35em; color: var(--zlato); margin: 4px 0; line-height: 1.7; }
  .ar-izvor { display: block; text-align: right; font-size: 0.8em; color: var(--blijedo); margin-bottom: 4px; }
  .prazno { color: var(--blijedo); font-size: 14px; }

  details { margin-top: 26px; border-radius: 14px; background: var(--kartica); border: 1px solid var(--rub); }
  .uputa, details { box-shadow: 0 4px 14px rgba(60, 50, 20, 0.06); }
  summary { padding: 14px 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
  .postavke { padding: 0 16px 16px; font-size: 14px; line-height: 1.45; }
  .postavke label { display: block; margin-top: 14px; font-weight: 600; }
  .postavke input, .postavke select {
    width: 100%; margin-top: 6px; padding: 11px 12px; font-size: 16px; border-radius: 10px;
    border: 1px solid var(--rub); background: #fff; color: var(--tekst);
  }
  .postavke .mali { color: var(--blijedo); font-size: 13px; margin-top: 4px; }
  .postavke .dugme { margin-top: 10px; padding: 10px 18px; font-size: 15px; }
  .postavke .dugme.sporedno { background: transparent; color: var(--zeleno); border: 1px solid var(--rub); box-shadow: none; }
</style>
</head>
<body>
<main>

  <!-- 1) Lozinka / Passwort -->
  <section id="prijava">
    <div class="prijava-vrh"><div class="jezici"></div></div>
    <div class="prijava">
      <img class="logo" src="../slike/logo-mittel.png" alt="">
      <h1 data-t="naslov"></h1>
      <form id="forma-lozinke" autocomplete="off">
        <input id="lozinka" type="password" inputmode="numeric">
        <br><button class="dugme" type="submit" data-t="udji"></button>
      </form>
      <div class="greska-lozinke" id="greska-lozinke"></div>
    </div>
  </section>

  <!-- 2) Glavno / Hauptseite -->
  <section class="skriveno" id="glavno">
    <div class="zaglavlje">
      <div class="naslov-red">
        <img class="logo" src="../slike/logo-mittel.png" alt="">
        <div>
          <h1 data-t="naslov"></h1>
          <div class="veza" id="veza"><i></i><span></span></div>
        </div>
      </div>
      <div class="jezici"></div>
    </div>

    <div class="mikrofon-dio">
      <button class="mikrofon" id="mikrofon" aria-label="Mikrofon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3.5"></path><path d="M8.5 21.5h7"></path>
        </svg>
      </button>
      <div class="status" id="status"></div>
      <div class="vrijeme" id="vrijeme"></div>
    </div>

    <button class="tv-dugme" id="tv-dugme" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
      <span id="tv-tekst"></span>
    </button>
    <button class="kraj-dugme skriveno" id="kraj-dugme" type="button">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
      <span id="kraj-tekst"></span>
    </button>

    <div class="upozorenje skriveno" id="upozorenje"></div>

    <div class="uputa">
      <b data-t="uputaNaslov"></b>
      <ol><li data-t="u1"></li><li data-t="u2"></li><li data-t="u3"></li></ol>
      <p data-t="u4"></p>
      <p data-t="u5"></p>
    </div>

    <div class="tok">
      <h2 data-t="tokNaslov"></h2>
      <div id="tok"></div>
    </div>

    <details id="detalji">
      <summary data-t="postavke"></summary>
      <div class="postavke">
        <label for="jezik" data-t="jezikGovora"></label>
        <select id="jezik">
          <option value="bs-BA">Bosanski</option>
          <option value="de-DE">Deutsch</option>
          <option value="ar-SA">العربية</option>
        </select>

        <label for="cilj" data-t="prijevodNa"></label>
        <select id="cilj">
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="bs">Bosanski</option>
          <option value="ar">العربية</option>
          <option value="tr">Türkçe</option>
        </select>

        <label for="prepoznavanje" data-t="prepoznavanje"></label>
        <select id="prepoznavanje">
          <option value="auto" data-t="optAuto"></option>
          <option value="gemini" data-t="optGemini"></option>
        </select>
        <div class="mali" id="prepoznavanje-info"></div>
        <div id="gemini-dio">
          <label for="gkljuc" data-t="gKljuc"></label>
          <input id="gkljuc" type="password" placeholder="AIza…" autocomplete="off">
          <div class="mali" data-t="gKljucInfo"></div>
          <label for="gmodel" data-t="gModel"></label>
          <input id="gmodel" type="text" autocomplete="off" spellcheck="false">
          <button class="dugme sporedno" id="spremi-gkljuc" type="button" data-t="spremi"></button>
          <span class="mali" id="gkljuc-stanje"></span>
        </div>

        <div id="prevodilac-dio">
        <label for="prevodilac" data-t="prevodilac"></label>
        <select id="prevodilac">
          <option value="google" data-t="optGoogle"></option>
          <option value="claude-haiku" data-t="optHaiku"></option>
          <option value="claude" data-t="optClaude"></option>
          <option value="gemini" data-t="optGeminiP"></option>
        </select>
        <div class="mali" id="prevodilac-info"></div>

        <div id="claude-dio" class="skriveno">
          <label for="kljuc" data-t="kljuc"></label>
          <input id="kljuc" type="password" placeholder="sk-ant-…" autocomplete="off">
          <div class="mali" data-t="kljucInfo"></div>
          <button class="dugme sporedno" id="spremi-kljuc" type="button" data-t="spremi"></button>
          <span class="mali" id="kljuc-stanje"></span>
        </div>
        </div>

        <label for="ar-nacin" data-t="arNacin"></label>
        <select id="ar-nacin">
          <option value="samo" data-t="optArSamo"></option>
          <option value="prijevod" data-t="optArPrijevod"></option>
        </select>
        <div class="mali" id="ar-nacin-info"></div>

        <button class="dugme sporedno" id="odjava" type="button" style="margin-top:22px" data-t="odjava"></button>
        <div class="mali" data-t="odjavaInfo"></div>
        <div class="mali" id="verzija" style="margin-top:14px;opacity:.6"></div>
      </div>
    </details>
  </section>
</main>

        if (e && /credit balance|billing|kredit/i.test(String(e.message || ""))) { upozori(function () { return t("guthaben"); }); throw e; }
        if (!bezFormata && e && e.status === 400) { bezFormata = true; return zahtjevClaude(c, iz, ck, sadrzaj); }
        throw e;
      }).then(function (odg) {
        if (odg.stop_reason === "refusal") throw new Error("refusal");
        return odg.content.filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("").trim();
      }).catch(function (e) {
        if (e && (e.status === 401 || e.status === 403)) upozori(function () { return t("kljucNe"); });
        throw e;
      });
    });
  }
  // Gemini kao prevodilac teksta (besplatni ključ) / Gemini als Text-Übersetzer (kostenloser Schlüssel)
  var G_SHEMA = { type: "OBJECT", properties: {
    translation: { type: "STRING" },
    verses: { type: "ARRAY", items: { type: "OBJECT", properties: { sura: { type: "INTEGER" }, from: { type: "INTEGER" }, to: { type: "INTEGER" }, meaning: { type: "STRING" } }, required: ["sura", "from", "to", "meaning"] } },
    arabic_meanings: { type: "ARRAY", items: { type: "STRING" } },
    comment: { type: "STRING" }
  }, required: ["translation", "verses", "arabic_meanings", "comment"] };
  function prevediGemini(r, iz, ck) {
    var model = citaj("hutba-gmodel") || G_MODEL;
    return prevediModelom(r, iz, ck, function (sadrzaj) {
      var primjeri = ck === "de" ? PRIMJERI_DE.map(function (m) { return { role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] }; }) : [];
      return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(citaj("hutba-gkljuc") || ""), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: uputa(iz, ck) }] },
          contents: primjeri.concat([{ role: "user", parts: [{ text: sadrzaj }] }]),
          generationConfig: { temperature: 0.2, responseMimeType: "application/json", responseSchema: G_SHEMA }
        })
      }).then(function (o) {
        return o.json().then(function (d) {
          if (!o.ok) {
            if (o.status === 400 || o.status === 403) upozori(function () { return "<b>" + t("gNe") + "</b>" + kodHtml(esc(String((d.error && d.error.message) || o.status).slice(0, 160))); });
            throw new Error("Gemini " + o.status);
          }
          return ((((d.candidates || [])[0] || {}).content || {}).parts || []).map(function (x) { return x.text || ""; }).join("").trim();
        });
      });
    });
  }
  function prevediModelom(r, iz, ck, posalji) {
    // Arapski tekst ne ide Claudeu – zamijeni se oznakom [1], [2] i vrati tačno onakav kakav je bio
    // Arabischer Text geht nicht an Claude – er wird durch [1], [2] ersetzt und danach unverändert zurückgesetzt
    var blokovi = [], naPocetku = [];
    var seg = r.bs.replace(/\([^()]*[\u0600-\u06FF][^()]*\)/g, function (m, poz) {
      blokovi.push(m); naPocetku.push(!r.bs.slice(0, poz).trim());
      return "[" + blokovi.length + "]";
    });
    var sadrzaj = kontekst(r) + "New segment (" + iz.ime + "):\n" + seg +
      (blokovi.length ? "\n\nArabic blocks (already in Arabic script - keep the markers" + (arSPrijevodom() ? ", translate them into arabic_meanings" : ", do NOT translate them") + "):\n" +
        blokovi.map(function (b, k) { return "[" + (k + 1) + "] = " + b.slice(1, -1).split(/\s+·\s+/)[0]; }).join("\n") : "");
    return posalji(sadrzaj).then(function (tekst) {
      var prijevod = tekst, ajeti = [], znacenja = [];
      try { var j = JSON.parse(tekst); if (j && typeof j.translation === "string") { prijevod = j.translation; ajeti = j.verses || []; znacenja = j.arabic_meanings || []; } } catch (e2) {}
      prijevod = umetniAjete(prijevod, ajeti, ck);
      blokovi.forEach(function (b, k) {
        var oznaka = "[" + (k + 1) + "]";
        if (ck !== "ar" && znacenja[k] && arSPrijevodom()) b = b + " " + String(znacenja[k]).trim();
        if (prijevod.indexOf(oznaka) >= 0) prijevod = prijevod.split(oznaka).join(b);
        else prijevod = naPocetku[k] ? b + " " + prijevod : prijevod + " " + b;
      });
      prijevod = ocistiIzlaz(prijevod);
      // Engleski ili objašnjenje -> umjesto toga Google / Englisch oder Erklärung -> stattdessen Google
      if (prijevod !== "-" && imaEngleskog(prijevod, ck)) throw new Error("engleski");
      if (prijevod !== "-" && imaIzvornihRijeci(prijevod, r.bs, iz, ck)) throw new Error("objasnjenje");
      return prijevod;
    });
  }

  function prevediGoogle(tekst, sl, tl) {
    if (sl === tl) return Promise.resolve(tekst);
    if (AR_BLOK.test(tekst)) {
      var dijeloviAr = tekst.split(AR_BLOK);
      return Promise.all(dijeloviAr.map(function (d, i) {
        if (i % 2 === 1) {
          if (sl !== "bs" || tl === "ar" || d === "ﷺ" || !arSPrijevodom()) return Promise.resolve(d);
          var ar = d.slice(1, -1).split(/\s+·\s+/)[0].replace(/﴿[^﴾]*﴾/g, " ");
          return prevediGoogleCisto(ar, "ar", tl).then(function (z) { return d + " " + z; }, function () { return d; });
        }
        return !/[A-Za-zÀ-ž]/.test(d) ? Promise.resolve(d) : prevediGoogleCisto(d.trim(), sl, tl);
      })).then(function (x) { return x.join(" ").replace(/\s+/g, " ").replace(/\s+([.,!?;:])/g, "$1").trim(); });
    }
    return prevediGoogleCisto(tekst, sl, tl);
  }
  function prevediGoogleCisto(tekst, sl, tl) {
    // Dugi tekst u dijelove do ~900 znakova / Langer Text in Stücke bis ~900 Zeichen
    var dijelovi = [], w = tekst.split(/\s+/), tren = "";
    w.forEach(function (x) { if ((tren + " " + x).length > 900 && tren) { dijelovi.push(tren); tren = x; } else tren = tren ? tren + " " + x : x; });
    if (tren) dijelovi.push(tren);
    var rez = [];
    return dijelovi.reduce(function (p, dio) {
      return p.then(function () { return googleJedan(dio, sl, tl); }).then(function (x) { rez.push(x); });
    }, Promise.resolve()).then(function () { return rez.join(" "); });
  }

  // Više besplatnih puteva: ako jedan ne radi (npr. Google blokira), probati sljedeći
  // Mehrere kostenlose Wege: geht einer nicht (z. B. Google sperrt), den nächsten versuchen
  var PUTEVI = [
    function (q, sl, tl) {
      return dohvati("https://translate.googleapis.com/translate_a/t?client=gtx&sl=" + sl + "&tl=" + tl + "&q=" + encodeURIComponent(q)).then(function (d) {
        var x = d && d[0]; if (Array.isArray(x)) x = x[0];
        if (typeof x !== "string") throw new Error("format"); return x;
      });
    },
    function (q, sl, tl) {
      return dohvati("https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + sl + "&tl=" + tl + "&dt=t&q=" + encodeURIComponent(q)).then(function (d) {
        return (d[0] || []).map(function (x) { return x[0]; }).join("");
      });
    },
    function (q, sl, tl) {
      return dohvati("https://api.mymemory.translated.net/get?langpair=" + sl + "|" + tl + "&q=" + encodeURIComponent(q)).then(function (d) {
        var x = d && d.responseData && d.responseData.translatedText;
        if (!x || d.responseStatus !== 200) throw new Error("MyMemory " + (d && d.responseStatus)); return x;
      });
    }
  ];
  var IMENA_PUTEVA = ["Google", "Google 2", "MyMemory"], dobarPut = 0;
  function dohvati(url) {
    return fetch(url).then(function (o) { if (!o.ok) throw new Error(o.status); return o.json(); });
  }
  function googleJedan(tekst, sl, tl) {
    var greske = [];
    function probaj(k) {
      if (k >= PUTEVI.length) return Promise.reject(new Error(greske.join(" · ")));
      var i = (dobarPut + k) % PUTEVI.length;
      return PUTEVI[i](tekst, sl, tl).then(function (x) { dobarPut = i; return x; }, function (e) {
        greske.push(IMENA_PUTEVA[i] + ": " + ((e && e.message) || e));
        return probaj(k + 1);
      });
    }
    return probaj(0);
  }

  function ukloni(r) {
    recenice = recenice.filter(function (x) { return x !== r; });
    r.de = "-"; r.gotovo = true; posaljiRecenicu(r);
    prikaziTok();
  }

  /* =================== Prikaz na mobitelu / Anzeige am Handy =================== */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  // Arapski tekst desno-nalijevo / Arabischer Text von rechts nach links
  function sArapskim(s) {
    // Arapski u zagradi: svoj red, zdesna nalijevo / Arabisch in Klammern: eigene Zeile, von rechts nach links
    return String(s).split(/(\([^()]*[؀-ۿ][^()]*\))/).map(function (dio, i) {
      if (i % 2 === 1) {
        var d = dio.slice(1, -1).split(/\s+·\s+/);
        return '<span class="ar-blok" dir="rtl">(' + esc(d[0].trim()) + ')</span>' + (d[1] ? '<span class="ar-izvor">' + esc(d[1]) + '</span>' : "");
      }
      return esc(dio).replace(/[؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿][؀-ۿݐ-ݿࢠ-ࣿﭐ-﷿ﹰ-﻿\s–—]*/g,
        function (a) { return '<bdi class="ar" dir="rtl">' + a.trim() + '</bdi> '; });
    }).join("");
  }

  function prikaziTok() {
    var zadnje = recenice.filter(function (r) { return r.bs; }).slice(-6).reverse();
    $("tok").innerHTML = zadnje.length ? zadnje.map(function (r) {
      return '<div class="recenica"><div class="bs">' + esc(r.bs) + '</div>' +
        '<div class="njem' + (r.gotovo ? "" : " ceka") + '"' + (ciljKod() === "ar" ? ' dir="rtl"' : "") + '>' +
        (r.gotovo ? sArapskim(r.de) : "…") + '</div></div>';
    }).join("") : '<div class="prazno">' + t("prazno") + '</div>';
  }

  /* =================== Automatsko ažuriranje / Automatische Aktualisierung =================== */
  // Nova verzija na GitHubu -> stranica se sama učita ponovo (ne dok mikrofon ili TV radi)
  // Neue Version auf GitHub -> Seite lädt sich selbst neu (nicht während Mikrofon oder Fernseher laufen)
  var mojaVerzija = null, cekaAzuriranje = false;
  function provjeriVerziju() {
    fetch("../vaktija.js?v=" + Date.now(), { cache: "no-store" }).then(function (o) { return o.text(); }).then(function (tx) {
      var m = /verzija:\s*([0-9.\-]+)/.exec(tx), v = m ? m[1] : "";
      if (!v) return;
      if (mojaVerzija === null) { mojaVerzija = v; $("verzija").textContent = "Verzija " + v; return; }
      if (v !== mojaVerzija) cekaAzuriranje = true;
      if (cekaAzuriranje && !snima && !aktivno) location.reload();
    }).catch(function () {});
  }
  provjeriVerziju();
  setInterval(provjeriVerziju, 3 * 60000);

  /* =================== Start =================== */
  pisiTiho("hutba-sin-lozinka", null); pisiTiho("hutba-sin-t", null);   // stari abgleich / alter Abgleich
  ucitajPostavkeUFormu();
  prevediStranicu();
  povezi();
  if (citaj("hutba-prijava") === "da" || citaj("hutba-prijava") === LOZINKA) { pisiTiho("hutba-prijava", "da"); otvori(); }
  else setTimeout(function () { $("lozinka").focus(); }, 300);
})();
</script>
